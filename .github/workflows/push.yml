name: Push

on:
  push:
  pull_request:

jobs:
  # Runs standalone: the engine artifact needs no JBrowse deps and no toolchain,
  # only node. Guards against the committed wasm being corrupted by a formatter
  # or truncated by a bad merge, which nothing else would notice until a user
  # actually asked for a force-directed layout.
  wasm-smoke:
    name: Bandage engine smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.x
      - name: Compute a layout with the committed engine
        run: node scripts/smoke-wasm.mjs

  spellcheck:
    name: Spell check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: crate-ci/typos@master

  # BLOCKED until the jbrowse-components `graph_viz` branch is pushed and this
  # plugin's `link:` deps point at something a runner can fetch. @jbrowse/core,
  # render-core, canvas and linear-genome-view are consumed as link:../../
  # siblings, so a fresh clone cannot install or build them. Set
  # JBROWSE_COMPONENTS_REF once that branch exists (or switch the deps to
  # published versions) and drop the `if: false`.
  build-and-test:
    name: Build, lint, typecheck, unit tests
    runs-on: ubuntu-latest
    if: false
    env:
      JBROWSE_COMPONENTS_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: jb2plugins/jbrowse-plugin-graphgenomeviewer
      # the link: specifiers resolve to ../../jbrowse-components2 relative to
      # the plugin, so the checkout layout has to mirror a local dev tree
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: GMOD/jbrowse-components
          ref: ${{ env.JBROWSE_COMPONENTS_REF }}
          path: jbrowse-components2
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: latest
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.x
          cache: pnpm
          cache-dependency-path: jb2plugins/jbrowse-plugin-graphgenomeviewer/pnpm-lock.yaml
      - name: Install jbrowse-components deps
        working-directory: jbrowse-components2
        run: pnpm install --frozen-lockfile
      - name: Install
        working-directory: jb2plugins/jbrowse-plugin-graphgenomeviewer
        run: pnpm install --frozen-lockfile
      - name: Build
        working-directory: jb2plugins/jbrowse-plugin-graphgenomeviewer
        run: pnpm build
      - name: Typecheck
        working-directory: jb2plugins/jbrowse-plugin-graphgenomeviewer
        run: pnpm typecheck
      - name: Lint
        working-directory: jb2plugins/jbrowse-plugin-graphgenomeviewer
        run: pnpm lint
      - name: Unit tests
        working-directory: jb2plugins/jbrowse-plugin-graphgenomeviewer
        run: pnpm test
      - name: Verify the vendored engine still loads
        working-directory: jb2plugins/jbrowse-plugin-graphgenomeviewer
        run: pnpm test:wasm

  # Also BLOCKED, and additionally needs a jbrowse-web built from the same
  # graph_viz sources: the plugin uses MUI 9 / render-core from that branch, so
  # it throws (createSvgIcon) in a stock `jbrowse create --nightly` built from
  # main. Once graph_viz ships, build jbrowse-web from it, point JBROWSE_TEST_DIR
  # at the output, and set RUN_E2E=1 (drop the `if: false`).
  e2e-tests:
    name: E2E (force layout in a real JBrowse)
    runs-on: ubuntu-latest
    needs: build-and-test
    if: false
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: jb2plugins/jbrowse-plugin-graphgenomeviewer
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: GMOD/jbrowse-components
          ref: main
          path: jbrowse-components2
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: latest
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.x
          cache: pnpm
          cache-dependency-path: jb2plugins/jbrowse-plugin-graphgenomeviewer/pnpm-lock.yaml
      - name: Install jbrowse-components deps
        working-directory: jbrowse-components2
        run: pnpm install --frozen-lockfile
      - name: Install
        working-directory: jb2plugins/jbrowse-plugin-graphgenomeviewer
        run: pnpm install --frozen-lockfile
      - name: Install Puppeteer Chrome
        working-directory: jb2plugins/jbrowse-plugin-graphgenomeviewer
        run: npx puppeteer browsers install chrome
      - name: Create JBrowse test instance
        working-directory: jb2plugins/jbrowse-plugin-graphgenomeviewer
        run: npx @jbrowse/cli create .test-jbrowse-nightly --nightly
      - name: E2E
        working-directory: jb2plugins/jbrowse-plugin-graphgenomeviewer
        run: RUN_E2E=1 pnpm test:e2e
