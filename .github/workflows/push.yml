name: Push

on:
  push:
  pull_request:

jobs:
  # Runs standalone: the engine artifact needs no JBrowse deps and no toolchain,
  # only node. Guards against the committed wasm being corrupted by a formatter
  # or truncated by a bad merge, which nothing else would notice until a user
  # actually asked for a force-directed layout.
  wasm-smoke:
    name: Bandage engine smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.x
      - name: Compute a layout with the committed engine
        run: node scripts/smoke-wasm.mjs

  spellcheck:
    name: Spell check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: crate-ci/typos@master

  build-and-test:
    name: Build, lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: latest
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      # Formatting drifts silently otherwise: `pnpm format` is the only thing
      # that writes it. Beside lint rather than inside it because prettier and
      # eslint disagree about who owns layout and the repo lets prettier win.
      - run: pnpm format:check
      - run: pnpm test
      - name: Verify the vendored engine still loads
        run: pnpm test:wasm

  # The only check that sees a bundle fail on a host: tsc, eslint and the unit
  # tests all passed while an RPC argument no released core could post to its
  # worker broke every cut on every hosted release.
  host-compat:
    name: Boot the bundle on hosted JBrowse releases
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: latest
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: npx puppeteer browsers install chrome
      - run: pnpm host-compat

  e2e-tests:
    name: E2E (force layout in a real JBrowse)
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: latest
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npx puppeteer browsers install chrome
      - name: Create JBrowse test instance
        run: npx @jbrowse/cli create .test-jbrowse --tag v5.0.0-beta.9
      - run: RUN_E2E=1 pnpm test:e2e
