name: Host watch

# jbrowse-web main deploys on every push and released hosts never change, but
# the bundle readers load is the published one, and push.yml only probes on a
# commit here. jbrowse-components d8db736896 removed a component the published
# bundle rendered, and every graph track on main failed with React error #130
# until someone opened one.
on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  published-bundle:
    name: Draw the published bundle on hosted JBrowse releases
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: latest
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npx puppeteer browsers install chrome
      - run: pnpm host-compat --published
