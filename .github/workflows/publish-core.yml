name: Publish core

on:
  push:
    tags:
      - 'core-v*'

jobs:
  publish:
    name: Publish @jbrowse/bandage-core to npm
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 10
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.x
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --frozen-lockfile
      # prepack builds dist, and publishConfig swaps the source exports for it.
      # working-directory, not --dir: pnpm 10 hands its argv to npm publish,
      # which rejects the stray path with EUSAGE.
      - run: pnpm publish --provenance --no-git-checks
        working-directory: packages/core
