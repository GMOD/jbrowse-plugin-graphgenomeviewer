name: Figure watch

# The figures in img/ draw main's bundle on jbrowse.org's hosted JBrowse, and
# a drawing change upstream or here reaches them without a reshoot: the track's
# stress engine reshaped every force figure, and tube_map_micb took position
# colour, with nobody looking. Each week this reshoots them all and uploads an
# old | new | diff strip for each that moved. It fails nothing; read the
# summary.
on:
  schedule:
    - cron: '0 10 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reshoot:
    name: Reshoot img/ and compare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: latest
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npx puppeteer browsers install chrome
      - run: pnpm build
      # bash, so pipefail keeps a failed reshoot from passing through tee
      - shell: bash
        run:
          node scripts/shoot-figures.mjs --compare figure-diffs | tee
          figure-watch.log
      - if: always()
        run: |
          {
            echo '## Figures that moved'
            grep -E 'px changed|, new' figure-watch.log || echo 'none'
          } >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: figure-diffs
          path: figure-diffs/
          if-no-files-found: ignore
